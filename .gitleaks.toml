title = "Gitleaks classroom rules"

[extend]
useDefault = true

[[rules]]
id = "classroom-aws-example"
description = "Published AWS example used in the classroom"
path = '''(^|/)config\.py$'''
regex = '''(?m)^AWS_ACCESS_KEY_ID\s*=\s*"(AKIAIOSFODNN7EXAMPLE)"'''
secretGroup = 1

[[rules]]
id = "pivot-api-key"
description = "Fictional PivotMove Logistics service API key"
path = '''(^|/)config\.py$'''
regex = '''\bPIVOT-[0-9]{6}\b'''
